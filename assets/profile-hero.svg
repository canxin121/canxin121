      <stop offset="1" stop-color="#3B230D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 10) rotate(130) scale(560 360)">
      <stop stop-color="#FFB663" stop-opacity="0.6"/>
