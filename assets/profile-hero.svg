<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">canxin profile banner</title>
  <desc id="desc">Dark orange gradient banner with profile title and blog link.</desc>
  <defs>
